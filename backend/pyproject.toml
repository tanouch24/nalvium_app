[project]
name = "nalvium-backend"
version = "0.1.0"
description = "Nalvium API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "openai>=1.60",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "av>=14",
  "httpx>=0.27",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL (see scripts/db.sh)"]

[tool.ruff]
line-length = 100
[tool.ruff.lint.per-file-ignores]
"app/api/routes/*" = ["B008"]
"app/api/deps.py" = ["B008"]
